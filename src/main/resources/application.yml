# =====================================================================
# SupportPilot - Sessions 1-2
# Profiles:   (default) -> OpenAI        local -> Ollama        anthropic -> Claude
# Run:        mvn spring-boot:run -Dspring-boot.run.profiles=local
# Never put API keys in this file - they come from environment variables.
# Session 2 needs PostgreSQL:  docker compose up -d
# =====================================================================
spring:
  application:
    name: supportpilot
  ai:
    model:
      chat: openai            # which ChatModel is active: openai | anthropic | ollama
      # Session 1 only needs chat. Switch the other model types off so that
      # providers you are not using do not ask for API keys at startup.
      embedding: none
      image: none
      audio:
        transcription: none
        speech: none
      moderation: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        model: ${ANTHROPIC_CHAT_MODEL:claude-haiku-4-5}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:llama3.2}
      init:
        pull-model-strategy: when_missing   # downloads the model on first start if needed
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always       # creates the SPRING_AI_CHAT_MEMORY table on start

  # Session 2, Checkpoint D: PostgreSQL for chat memory (docker compose up -d)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/supportpilot}
    username: ${DB_USER:supportpilot}
    password: ${DB_PASSWORD:supportpilot}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    # DEBUG shows every prompt and response logged by SimpleLoggerAdvisor.
    # Great for learning - turn it off in production (prompts can contain personal data).
    org.springframework.ai.chat.client.advisor: DEBUG

supportpilot:
  homework:
    questions: homework/questions.txt
    results-dir: results
  # Session 2, Checkpoint A: which prompt file to use (prompts/triage-system-<version>.st)
  triage:
    prompt-version: v2
    native-structured-output: true   # send the JSON schema to the provider as an API constraint
  # Session 2, Checkpoint D: how many messages of history are sent back to the model
  memory:
    max-messages: 20
  # Session 2, Checkpoint E: labelled tickets for the accuracy runner
  accuracy:
    dataset: data/tickets-labelled.csv

---
spring:
  config:
    activate:
      on-profile: local
  ai:
    model:
      chat: ollama

---
spring:
  config:
    activate:
      on-profile: anthropic
  ai:
    model:
      chat: anthropic

---
# Homework runner: combine with a provider profile, e.g. --spring.profiles.active=local,compare
spring:
  config:
    activate:
      on-profile: compare
  main:
    web-application-type: none

---
# Session 2 triage accuracy runner: combine with a provider profile, e.g. --spring.profiles.active=local,accuracy
spring:
  config:
    activate:
      on-profile: accuracy
  main:
    web-application-type: none
