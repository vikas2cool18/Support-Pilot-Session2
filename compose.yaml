# Optional: run Ollama in Docker instead of installing it natively.
#   docker compose up -d
#   docker compose exec ollama ollama pull llama3.2
# Native Ollama is usually faster on laptops (it can use the Apple/NVIDIA GPU directly).
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  ollama-models:
